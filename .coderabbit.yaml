# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"
early_access: false
tone_instructions: >-
  Be direct, technical, and concise. Report only actionable defects introduced
  by the pull request, and distinguish deterministic evidence from
  hardware-specific claims.

reviews:
  profile: "chill"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  sequence_diagrams: false
  changed_files_summary: false
  estimate_code_review_effort: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  in_progress_fortune: false
  enable_prompt_for_ai_agents: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!**/bin/**"
    - "!**/obj/**"
  path_instructions:
    - path: "src/WindowsDeviceControl/WindowsRadio*.cs"
      instructions: |
        - Preserve access-before-mutation, every-adapter application, and state
          priority On, Disabled, Off, Unknown, Absent.
        - Keep all-interface WLAN, `WifiNetworkKey` identity (SSID bytes plus
          security), XML profile matching, collision-free all-user profiles,
          rollback, and callback-before-connect.
        - Watches return independent disposable registrations; no process-wide
          feed slot, and callback exceptions stay contained.
        - Bluetooth snapshots combine classic/LE and merge containers; the live
          watcher keys endpoint ids and emits events immediately.
        - Preserve handler revocation, exact-once pairing tokens under races,
          attempt-local cancellation, and one bounded pairing deadline.
        - Every member except `PairBluetoothAsync` blocks; document new
          blocking calls rather than adding token overloads.
        - Keep destructive unpairing separate from soft audio connection.
    - path: "src/WindowsDeviceControl/WifiProfile.cs"
      instructions: |
        Preserve XML escaping, exact SSID `<hex>`, PSK validation, and distinct
        WPA3 transition, WPA2-AES, legacy WPA-TKIP, and OWE forms. Enterprise
        and WEP stay explicitly unsupported; flag invented flows for them.
    - path: "src/WindowsDeviceControl/CoreAudio*.cs"
      instructions: |
        - Int-returning methods expose HRESULTs; flag lossy booleans or enums.
        - Preserve COM declarations/releases, PROPVARIANT cleanup, container
          identity, one-shot IKsControl requests, and later confirmation.
        - Default changes transact across all three roles: snapshot first, roll
          changed roles back in reverse, try every rollback, and retain results.
    - path: "src/WindowsDeviceControl/Backlight.cs"
      instructions: |
        Preserve the `\\.\LCD` ACPI contract, native layouts/bounds, and paired
        AC/DC writes. Missing internal-panel control remains a truthful Try
        result, not success or a WMI/DDC-CI substitution.
    - path: "src/WindowsDeviceControl/WaveOutFeedback.cs"
      instructions: |
        Preserve the reusable open endpoint, drop a cue while one is queued
        instead of accumulating repeats, and release every native resource on
        disposal and failure paths.
    - path: "src/WindowsDeviceControl/AudioFilePreview.cs"
      instructions: |
        One owner per preview: it changes neither endpoint selection nor
        volume, reports failures with Windows' error class and HRESULT, and a
        stopped preview's queued failure must not replace a newer status.
    - path: "src/WindowsDeviceControl/Display*.cs"
      instructions: |
        - Identity rematches by device path, then EDID ids; LUID and target id
          are routes refreshed after hotplug. Skip an unreadable unrelated path.
        - Every display write takes the one shared write gate; reads take no
          lock. A write Windows accepts is the result and is never read back.
          A refused layout or mode gets exactly one rollback; nothing retries.
        - Layout apply and rollback keep `SDC_SAVE_TO_DATABASE`. Display
          records are persisted by consumers: no renames, retypes or removals,
          and added positional members carry defaults.
        - Results carry outcome codes and native statuses, not English text.
        - EDID parsing keeps strict checksums and block bounds.
    - path: "src/WindowsDeviceControl/WindowsPower*.cs"
      instructions: |
        Requests are issued once per power source: no retry, no rollback, no
        scheme activation on the caller's behalf, and no readback confirmation.
        Hybrid core values come from Windows' published lists, and unnamed
        values are preserved. Notification registrations unregister on
        disposal. Power actions stay behind the internal port so tests never
        reach suspend or shutdown.
    - path: "src/WindowsDeviceControl/ModernStandby.cs"
      instructions: |
        Wake control is per named device, never wholesale; power button,
        sleep button and lid are reported, never written. Restore attempts
        every observed device once and returns the failures. Only
        `ERROR_NO_MORE_ITEMS` ends enumeration, and no buffer or count cap
        truncates the list.
    - path: "src/WindowsDeviceControl/WindowsWakeSecurity.cs"
      instructions: |
        Capture records absent values and refuses non-DWORD values. Restore
        writes only what the snapshot recorded, attempts every step once and
        reports failures. The library never elevates and stores no
        application configuration.
    - path: "src/WindowsDeviceControl/PowerRequest*.cs"
      instructions: |
        The request list decodes an undocumented layout through bounds-checked
        reads; a surprise yields an unknown status, never a plausible wrong
        list. The buffer grows until the list fits. Request owners keep their
        reason buffer alive for the handle's lifetime.
    - path: "src/WindowsDeviceControl/WindowsStorage.cs"
      instructions: |
        Read-only. Nothing formats, mounts, ejects or writes, network drives
        are skipped, and an unqueryable volume is omitted rather than invented.
    - path: "src/WindowsDeviceControl/Interop.cs"
      instructions: |
        Shared helpers must preserve Win32 error codes and stack traces. Flag
        new blocking waits that are not documented on their public caller.
    - path: "src/WindowsDeviceControl/WindowsDeviceControl.csproj"
      instructions: |
        Preserve both net8.0/net10.0 Windows 10.0.19041.0 targets, that platform
        floor, package metadata, and warnings-as-errors including CS1591/CS1573
        unless an intentional public-contract change documents otherwise.
    - path: "tests/WindowsDeviceControl.Tests/**"
      instructions: |
        Keep tests deterministic and hardware-independent. Cover changed
        aggregation, identity, profile rollback, callback/token idempotence,
        role rollback, native boundaries, and lifetime decisions. Fixtures do
        not prove driver or device compatibility.
    - path: "docs/**"
      instructions: |
        Treat live findings and rejected API routes as evidence. Keep behavior,
        callback timing, failures, and hardware/Windows-build qualifications in
        sync with implementation and public XML docs.

knowledge_base:
  code_guidelines:
    enabled: true
